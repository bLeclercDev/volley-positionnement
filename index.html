<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Positionnement 5-1</title>
  <meta name="description" content="Entraînement au positionnement volley : réception et base 1, rotation par rotation.">
  <style>
    :root {
      --bg: #f5f4ef;
      --ink: #1f2a33;
      --muted: #66707a;
      --card: #ffffff;
      --line: #d9d6cc;
      --front: #f2c9a3;
      --back: #a9d3e2;
      --accent: #1d6fa5;
      --ok: #2e9e5b;
      --ok-bg: #d9f2e2;
      --ko: #d0433a;
      --ghost: #9aa4ad;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { padding: 16px; max-width: 520px; margin: 0 auto; -webkit-tap-highlight-color: transparent; }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 16px 0 8px; }
    p { margin: 6px 0; }
    .muted { color: var(--muted); font-size: 0.92rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .between { justify-content: space-between; }
    button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.wide { width: 100%; }
    button[disabled] { opacity: 0.5; cursor: default; }
    .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .roles button { text-align: left; display: flex; gap: 10px; align-items: center; padding: 8px 10px; }
    .roles button.selected { outline: 3px solid var(--accent); }
    .chip { display: inline-flex; width: 34px; height: 34px; border-radius: 50%; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex: none; }
    .chip.front { background: var(--front); }
    .chip.back { background: var(--back); }
    .score { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.02em; }
    .badge { background: #e8eef3; border-radius: 999px; padding: 3px 10px; font-size: 0.85rem; font-weight: 600; }
    .badge.serve { background: #e3f2e8; color: #1f6b3d; }
    .badge.receive { background: #fbe9e7; color: #8a2f28; }
    .question { font-size: 1.05rem; font-weight: 600; margin: 8px 0; }
    /* Ligne sous la question : hauteur réservée (1 ligne) pour que le terrain ne bouge pas entre question et feedback. */
    .lead { font-size: 0.95rem; line-height: 1.4; min-height: 1.4em; margin: 6px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .legend { font-size: 0.85rem; margin: 4px 0 8px; }
    /* pan-y : le doigt peut faire défiler la page depuis le terrain ; le tap est validé au relâchement (bindTap). */
    svg.court { width: 100%; height: auto; display: block; touch-action: pan-y; user-select: none; }
    svg.court.tappable { cursor: crosshair; }
    details.inset { padding: 8px 14px; }
    details.inset summary { cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--muted); }
    .inset-body { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
    .inset-body svg { width: 120px; flex: none; }
    .verdict { font-weight: 700; }
    .verdict.ok { color: var(--ok); }
    .verdict.ko { color: var(--ko); }
    .note { background: #fbf6ea; border-left: 4px solid #e2b35a; padding: 8px 10px; border-radius: 6px; font-size: 0.92rem; }
    ul.failed { padding-left: 18px; margin: 6px 0; }
    /* Tableau des meilleurs scores : une ligne par poste, fond teinté selon le % (--tint posé en inline). */
    .bests h2 { margin-top: 0; }
    .bests table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    .bests th { text-align: left; font-weight: 600; color: var(--muted); padding: 4px 8px; }
    .bests td { padding: 6px 8px; }
    .bests tbody tr { background: var(--tint); }
    .bests td:last-child, .bests th:last-child { text-align: right; font-weight: 700; }
    label.check { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
    .tools { margin-top: 16px; }
    .tools button { font-size: 0.9rem; padding: 8px 12px; color: var(--muted); }
    button.link { font-size: 0.85rem; padding: 2px 8px; border-radius: 999px; color: var(--accent); }

    /* Frise des 3 phases du point (Service → Réception → Après réception). */
    .phases { list-style: none; display: flex; gap: 6px; margin: 10px 0 0; padding: 0; }
    .phases li { flex: 1; text-align: center; font-size: 0.75rem; line-height: 1.2; color: var(--muted); padding: 4px 2px; border-bottom: 3px solid var(--line); }
    .phases li strong { display: block; font-size: 0.82rem; font-weight: 600; }
    .phases li.current { color: var(--ink); border-color: var(--accent); }
    .phases li.done { opacity: 0.55; }
    .phases li + li { position: relative; }
    .phases li + li::before { content: '→'; position: absolute; left: -7px; top: 4px; color: var(--line); }
    /* Petits écrans : la frise garde seulement le nom des phases, pour que le terrain reste visible sans défiler. */
    @media (max-width: 480px) {
      .phases li span { display: none; }
      .phases li { padding: 3px 2px; }
    }

    /* Couche animée de l'écran de question : elle raconte la phase et ne capte aucun tap. */
    svg.court .anim, svg.court .anim * { pointer-events: none; }
    .anim .ghosts { opacity: 0.75; animation: ghosts-out 0.5s ease-in 2.9s forwards; }
    /* Ballon : .ball suit le trajet (--x0/--y0 … posés inline), .ball-arc fait la cloche, .ball-spin tourne. */
    .ball { transform: translate(var(--x0), var(--y0)); }
    .ball-arc, .ball-spin { transform-box: fill-box; transform-origin: center; } /* pivot = centre du ballon, pas l'origine du SVG */
    .ball-spin { animation: spin 0.9s linear infinite; }
    .ball.fly-1 { animation: fly-1 2.2s ease-in-out forwards; }
    .ball.fly-1 .ball-arc { animation: hop-1 2.2s ease-in-out forwards; }
    .ball.fly-4 { animation: fly-4 3.2s ease-in-out forwards; }
    .ball.fly-4 .ball-arc { animation: hop-4 3.2s ease-in-out forwards; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ghosts-out { to { opacity: 0; } }
    /* Service / réception : le ballon tourne sur place (0–25 %), vole (25–70 %), se pose, puis s'efface. */
    @keyframes fly-1 {
      0%, 25% { transform: translate(var(--x0), var(--y0)); opacity: 1; }
      70%, 85% { transform: translate(var(--x1), var(--y1)); opacity: 1; }
      100% { transform: translate(var(--x1), var(--y1)); opacity: 0; }
    }
    @keyframes hop-1 {
      0%, 25%, 70%, 100% { transform: translate(0, 0) scale(1); }
      47% { transform: translate(0, -9px) scale(1.35); }
    }
    /* Après réception : leur camp → réception (L) → passe (P) → attaque au filet → leur camp, puis s'efface. */
    @keyframes fly-4 {
      0%, 10% { transform: translate(var(--x0), var(--y0)); opacity: 1; }
      30%, 36% { transform: translate(var(--x1), var(--y1)); }
      52%, 58% { transform: translate(var(--x2), var(--y2)); }
      72%, 78% { transform: translate(var(--x3), var(--y3)); opacity: 1; }
      92% { transform: translate(var(--x4), var(--y4)); opacity: 1; }
      100% { transform: translate(var(--x4), var(--y4)); opacity: 0; }
    }
    @keyframes hop-4 {
      0%, 10%, 30%, 36%, 52%, 58%, 72%, 78%, 92%, 100% { transform: translate(0, 0) scale(1); }
      20%, 85% { transform: translate(0, -9px) scale(1.35); }
      44%, 65% { transform: translate(0, -5px) scale(1.15); }
    }
    @media (prefers-reduced-motion: reduce) {
      .anim * { animation: none !important; }
      .anim .ghosts { opacity: 0.45; }
      #rewatch { display: none; }
    }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"><p class="muted">Chargement…</p></main>
  <noscript><p>Cette appli a besoin de JavaScript.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
